
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deployquist-service
                port:
                  number: 80

          - path: /vinay
            pathType: Prefix
            backend:
              service:
                name: race-service
                port:
                  number: 80
