
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: race-deployment
  namespace: dev
spec:
  serviceName: race-service
  replicas: 3

  selector:
    matchLabels:
      app: race

  template:
    metadata:
      labels:
        app: race
    spec:
      containers:
        - name: race-container
          image: vinaikumarp/f1_race:v1.1.0
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "100Mi"
              cpu: "120m"
            requests:
              memory: "50Mi"
              cpu: "100m"

          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
